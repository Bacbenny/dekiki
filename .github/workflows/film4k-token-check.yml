name: Kiem tra token Film4k

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      refresh_required: ${{ steps.check.outputs.refresh_required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check token expiry in current m3u
        id: check
        run: |
          python3 - <<'PYEOF'
          import base64, json, sys, urllib.request, datetime, os
          from urllib.parse import parse_qsl, urlsplit

          URL = "https://raw.githubusercontent.com/Bacbenny/dekiki/main/film4k.m3u?cache_bust=" + str(int(datetime.datetime.now(datetime.timezone.utc).timestamp()))

          def jwt_exp(token: str) -> int | None:
              parts = token.split(".")
              if len(parts) < 2:
                  return None
              payload = parts[1]
              payload += "=" * (-len(payload) % 4)
              try:
                  data = json.loads(base64.urlsafe_b64decode(payload))
                  exp = data.get("exp")
                  return exp if isinstance(exp, (int, float)) else None
              except Exception:
                  return None

          def write_refresh(value: bool) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"refresh_required={'true' if value else 'false'}\n")

          try:
              req = urllib.request.Request(URL, headers={"User-Agent": "token-check/1.0"})
              content = urllib.request.urlopen(req, timeout=15).read().decode("utf-8")
          except Exception as e:
              print(f"Cannot fetch m3u: {e}")
              write_refresh(True)
              sys.exit(0)

          if not content.strip():
              print("m3u is empty — trigger update")
              write_refresh(True)
              sys.exit(0)

          now = datetime.datetime.now(datetime.timezone.utc).timestamp()
          earliest = None
          checked = 0
          unparsed_expiry = False

          for line in content.splitlines():
              if not line.startswith("http"):
                  continue
              parsed = urlsplit(line)
              if "/film4k/stream/" in parsed.path:
                  continue
              for key, value in parse_qsl(parsed.query, keep_blank_values=True):
                  token_exp = jwt_exp(value)
                  if token_exp is not None:
                      checked += 1
                      earliest = token_exp if earliest is None else min(earliest, token_exp)
                      continue
                  normalized_key = key.lower().replace("-", "_")
                  if normalized_key in {"auth", "cdntoken", "jwt", "timestamp", "exp", "expires", "expiry", "expires_at", "expiration"}:
                      try:
                          expiry = int(value)
                          if expiry > 10**12:
                              expiry //= 1000
                          if expiry < 10**9:
                              raise ValueError("not an epoch timestamp")
                          checked += 1
                          earliest = expiry if earliest is None else min(earliest, expiry)
                      except (TypeError, ValueError):
                          unparsed_expiry = True

          if unparsed_expiry:
              print("An expiry-marked URL could not be parsed — trigger update")
              write_refresh(True)
              sys.exit(0)

          if checked == 0:
              print("No expiring URL tokens found; stable URLs need no token refresh")
              write_refresh(False)
              sys.exit(0)

          remaining = earliest - now
          earliest_str = datetime.datetime.fromtimestamp(
              earliest, tz=datetime.timezone.utc
          ).strftime("%Y-%m-%d %H:%M UTC")

          print(f"Checked {checked} tokens")
          print(f"Earliest expiry: {earliest_str}")
          print(f"Remaining: {remaining/60:.0f} minutes")

          # Refresh before expiry; the Worker resolver is also refreshed on demand.
          threshold = 60 * 60
          expired = remaining < threshold
          write_refresh(expired)

          if expired:
              print(f"Tokens expire in {remaining/60:.0f} min — triggering update")
          else:
              print(f"Tokens still valid for {remaining/60:.0f} min — skipping")
          PYEOF

  refresh-playlist:
    needs: check-token
    if: needs.check-token.outputs.refresh_required == 'true'
    uses: ./.github/workflows/film4k-update.yml
    secrets: inherit
