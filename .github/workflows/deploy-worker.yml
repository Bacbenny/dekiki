name: Deploy Film4k Worker

on:
  push:
    paths:
      - "workers/dekki.js"
      - "deploy_workers.py"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FILM4K_USERNAME: ${{ secrets.FILM4K_USERNAME }}
          FILM4K_PASSWORD: ${{ secrets.FILM4K_PASSWORD }}
        run: python deploy_workers.py
