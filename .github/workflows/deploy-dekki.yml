name: Deploy dekki worker
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 deploy_workers.py
      - run: |
          curl -sS --max-time 15 "https://dekki.bacbenny95.workers.dev/healthz" || true
