name: Film4K JWT comparison playlist

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-jwt-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v4
        with:
          ref: jwt-comparison
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Film4K with expiring JWT URLs
        env:
          FILM4K_USERNAME: ${{ secrets.FILM4K_USERNAME }}
          FILM4K_PASSWORD: ${{ secrets.FILM4K_PASSWORD }}
          FILM4K_DIRECT_JWT: "1"
          FILM4K_OUTPUT_FILE: film4k-jwt.m3u
        run: python3 film4k_fetch.py

      - name: Commit comparison playlist
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add film4k-jwt.m3u
          if git diff --staged --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Update JWT comparison playlist [skip ci]"
            git push origin HEAD:jwt-comparison
          fi
