name: Cap nhat Film4k channel M3U

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: film4k-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-film4k:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Sign in and fetch Film4k channels
        env:
          FILM4K_USERNAME: ${{ secrets.FILM4K_USERNAME }}
          FILM4K_PASSWORD: ${{ secrets.FILM4K_PASSWORD }}
        run: python3 film4k_fetch.py

      - name: Commit and push film4k.m3u
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action Bot"
          git add film4k.m3u
          if git diff --staged --quiet; then
            echo "Khong co thay doi. Bo qua commit."
          else
            TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S ICT')
            git commit -m "cap nhat film4k.m3u luc ${TIMESTAMP} [skip ci]"
            git push origin main
          fi
