name: Cap nhat Film4k M3U

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-film4k:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Setup Vietnam VPN via VPN Gate
        continue-on-error: true
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq openvpn
          echo "Finding Vietnam VPN server..."
          python3 vpn_gate_setup.py

          VPN_STATUS=$(cat /tmp/vpn_status.txt 2>/dev/null || echo "NOT_FOUND")

          if [ "$VPN_STATUS" = "FOUND" ]; then
              echo "Starting OpenVPN..."
              sudo openvpn --config /tmp/vpn_config.ovpn --daemon --log /tmp/openvpn.log
              echo "Waiting for VPN connection..."
              for i in $(seq 1 30); do
                  IP=$(curl -s --max-time 5 https://api.ipify.org 2>/dev/null || true)
                  if [ -n "$IP" ]; then
                      echo "Connected! IP: $IP"
                      break
                  fi
                  sleep 2
              done
          else
              echo "No Vietnam VPN available. Trying direct connection..."
          fi

      - name: Fetch Film4k channels and generate M3U
        run: |
          python3 film4k_fetch.py

      - name: Commit and push film4k.m3u
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action Bot"
          git add film4k.m3u
          if git diff --staged --quiet; then
            echo "Khong co thay doi. Bo qua commit."
          else
            TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S ICT')
            git commit -m "cap nhat film4k.m3u luc ${TIMESTAMP} [skip ci]"
            git push origin main
          fi
